  ad_astra:tier_1_rocket: ad_astra:gui/sprites/overlay/rocket
  ad_astra:tier_2_rocket: ad_astra:gui/sprites/overlay/rocket
  ad_astra:tier_3_rocket: ad_astra:gui/sprites/overlay/rocket
  ad_astra:tier_4_rocket: ad_astra:gui/sprites/overlay/rocket
  ad_astra:moon_globe: ad_astra:environment/moon
  ad_astra:mars_globe: ad_astra:environment/mars
  ad_astra:venus_globe: ad_astra:environment/venus
  ad_astra:mercury_globe: ad_astra:environment/mercury
  ad_astra:glacio_globe: ad_astra:environment/glacio

sifting_order: [minecraft:dirt, minecraft:gravel, minecraft:sand, createsifter:dust, minecraft:soul_sand,
                ad_astra:moon_sand, ad_astra:mars_sand, ad_astra:conglomerate, ad_astra:venus_sand, createsifter:crushed_end_stone]

progression_notes:
  - >
    **Umvuthi.** The quest subtitle says "Optional boss in the Venus wastelands", but the datapack's
    `mowziesmobs/worldgen/structure/umvuthana_grove.json` only allows the grove in `quicreate:venus_fungal_forest`.
    (`config/mowziesmobs-common.toml` still whitelists `ad_astra:venus_wastelands` for Umvuthi.)
  - >
    **Card packs on a Deployer.** Quicreate replaces each pack-content recipe in `data/cards/recipes/` with a
    Deployer + Shears recipe on the pack. All cards of one pack share the same two inputs, so the files do not say
    which card a deployer will give.
  - >
    **Quests without arrows.** Several 1.2 quests have no dependencies in the quest book (Electricity, Crushing Wheels,
    Mechanical Crafters, Carbon Brush, Wires, Mechanical Extruder). The guide places them after the quests that make
    their ingredients.
  - >
    **Planet mobs without drops.** Ad Astra's mobs (Pygro, Mogler, Martian Raptor, Glacian Ram, Corrupted Lunarian...)
    have no entity loot tables in any jar, so the guide lists them with no drops.

appendix_text:
  audit: "Common skyblock bottlenecks, with every source found in the pack files."

  sifting: "Every `createsifter:sifting` recipe in the pack. Chances are per sifted block."
  extruder: "The Mechanical Extruder makes a block forever. The block below it is a catalyst and is not used up."
  fishing: "The fishing rod's tier decides which kelpy balls you can catch. The modifier first rolls the rare extras, then the heavy, medium and light ball, each with the chance shown; if nothing hits you get the normal fishing catch."
  cards: "Packs give random cards when opened. The pack-to-card lists below come from the pack-content recipe files."
  bosses: "Chances are per kill and include every pool in the boss's loot table."
  nosource: "Items that a quest or a shown recipe needs, but that have no recipe, ore, mob drop, loot or other source in the files the builder read."

build_notes:
  vanilla: >
    Jake's PrismLauncher libraries folder (with the vanilla client jar and Forge) was not shared with this build,
    so vanilla 1.20.1 recipes, loot tables, tags, models, textures and names were taken from the misode/mcmeta
    1.20.1 data and assets branches (extracted from the official client jar), and Forge's own item tags
    (forge:ingots/iron and friends) from the MinecraftForge 1.20.1 branch's generated resources. On Jake's PC
    the builder finds the real client jar and Forge universal jar in the libraries folder by itself.
  limits: >
    The builder only knows what is in data files. Things done by game code are not in this book unless a
    quest or this guide's mechanics list mentions them: villager trades, the odds of opening card packs, the
    Ender Dragon and Wither drops, bucket filling, axe stripping, mobs that structures spawn from code, and
    spawn-egg colours (spawn eggs are drawn untinted). Drop chances are worked out from the loot tables
    without looting or fortune.

# In-game mechanics that are hard-coded (so no data file describes them). Item id patterns (* = anything).
mechanics:
  "minecraft:stripped_*": Strip a log or wood block by right-clicking it with an axe.
  "minecraft:water": Infinite water source (two source blocks) or a bucket from the ocean.
  "minecraft:water_bucket": Fill a bucket from the ocean.
  "minecraft:nether_star": "Dropped by the Wither when you kill it (handled by the game code, see [[#wither]])."
  "minecraft:honeycomb": Bees (from a Bee card → Bee Spawn Egg) fill a beehive or nest; shear a full one.
  "minecraft:cobblestone": Cobblestone generator, lava flowing next to water (the starting chest has a lava bucket).

# When a recipe accepts a tag (any log, any planks...), show these items first if they are in the tag.
prefer_items: [minecraft:oak_log, minecraft:stripped_oak_log, minecraft:oak_planks, minecraft:cobblestone,
               minecraft:iron_ingot, minecraft:coal, minecraft:charcoal, create:iron_sheet, create:copper_sheet]

settings:
  recipe_score_cutoff: 7   # higher shows more (worse) alternative recipes on a step

# Items people ask about. Appendix F lists every source the builder finds for them (or none).
audit_items: [minecraft:nether_wart, minecraft:sponge, minecraft:wet_sponge, minecraft:honeycomb, minecraft:totem_of_undying,
              minecraft:lava_bucket, minecraft:blaze_rod, minecraft:obsidian, minecraft:slime_ball, minecraft:leather,
              minecraft:wither_skeleton_skull, minecraft:nether_star, minecraft:ender_pearl, minecraft:glowstone_dust,
              minecraft:diamond, minecraft:emerald, minecraft:lapis_lazuli, minecraft:ancient_debris, cards:platinum_ingot,
              ad_astra:desh_ingot, ad_astra:ostrum_ingot, ad_astra:calorite_ingot, minecraft:bone_meal, minecraft:sugar_cane,
              minecraft:prismarine_shard, minecraft:shulker_shell]
