# Quicreate Skyblock walkthrough: the hand-written part.
#
# The builder (build_guide.py) reads the quest book and every recipe, loot table and worldgen
# file itself. This file only holds prose and layout: chapter order and colours, intros, tips,
# per-quest notes and a few settings. Change progression in the quest book / datapack / scripts,
# then rebuild: steps, recipes and sources update on their own. Only edit this file when you
# want different words, a different chapter order, or an extra note on a step.
#
# Text fields understand **bold**, *italic*, [[namespace:item]] (item chip with icon) and
# [[#quest_id]] (link to that quest's step). Blank lines start new paragraphs.

meta:
  title: Quicreate Skyblock RFA
  subtitle: "Walkthrough · pack version 0.9.0 · Minecraft 1.20.1 Forge"
  cover_items: [createsifter:sifter, create_new_age:generator_coil, quicreate:emerald_circuit,
                ad_astra:launch_pad, ad_astra:desh_ingot, ad_astra:ostrum_ingot, ad_astra:calorite_ingot,
                cataclysm:ignitium_ingot, quicreate:creative_alloy]
  cover_text: >
    A step-by-step route from a tree in the ocean to creative-tier Create parts on five worlds.
    Every recipe, drop chance and ore in this book was read from the pack's own files when it was built.

how_to_use: |
  The guide follows the in-game quest book (Heracles) chapter by chapter, in the order you will play it.
  Each quest is one **step**, numbered **#1** onwards. A step shows what the quest asks for, the quest's own
  hint, the recipe (with the machine it needs), and for every ingredient *where it comes from*: an earlier
  step, a sifting table, an ore, a mob drop, fishing, or a short recipe.

  Recipes shown are the ones that exist in this pack after the CraftTweaker scripts and the Quicreate
  datapack have changed them, so they can differ from the wiki. When an item has several recipes the guide
  shows the one that fits the route best and says how many others JEI will show you.

  Worlds have a **what is here** box at the start of their chapter: terrain, ores (with heights), mobs and
  their drops, and the structures with the mobs and chest loot inside them. The appendices at the back hold
  the full sifting tables, the Mechanical Extruder list, fishing, card packs and spawn eggs, boss drops, and
  a list of anything the builder could not find a source for.

route_text: >
  Island → Sifting → New Age (solar heat, brass, electricity) → Improvements (circuits, nuclear heat, steel)
  → Space (your first rocket) → the Moon (stronghold and the Ender Dragon: the soft ending) → Mars → Venus and
  Mercury → Glacio → the creative parts (the true ending). The Cards & Mobs side chapter can be done any time
  after you have a sifter.

chapters:
  - group: "Chapter 1: The Sky"
    title: The Island
    color: "#3f7d3a"
    icon: minecraft:oak_sapling
    route_items: [minecraft:oak_log, minecraft:crafting_table, minecraft:charcoal, create:andesite_alloy, create:andesite_casing]
    summary: "Wood, cobblestone, andesite alloy and your first Create parts."
    intro: |
      You start on a small island in an endless ocean. The island template in
      `config/easy_skyblock_island/islands/default.nbt` is grass and dirt with one oak tree, and a chest holding a
      single [[minecraft:lava_bucket]]. Keep that lava: with water it is your first cobblestone generator.
    tips:
      - Your inventory is kept on death (see [[#about_this_modpack]]).
      - Vein mining (the `~` key, Ore Excavation) takes whole trees and their leaves at once.
      - Andesite alloy in this pack is made with charcoal, so get a furnace and burn logs early.
  - group: "1.1: Sifting"
    title: Sifting
    color: "#9a7432"
    icon: createsifter:sifter
    route_items: [create:millstone, createsifter:sifter, createsifter:string_mesh, createsifter:andesite_mesh, createsifter:zinc_mesh, createsifter:brass_mesh]
    summary: "Mill cobblestone down to gravel, sand and dust, then sift them for metals, redstone and more."
    intro: |
      Sifting is how you get almost every raw material on the island. Mill cobblestone into gravel, gravel into
      sand and sand into dust, then put them through a Sifter with a mesh. Better meshes give better drops, and a
      **waterlogged** sifter has its own drop table. The full tables are in Appendix A.
    tips:
      - Meshes go in the sifter; the block you sift is the input. String mesh → andesite → zinc → brass → advanced brass.
      - Card packs drop from many sifting tables at low chances. See the Cards & Mobs chapter.
  - group: "1.2: New Age"
    title: New Age
    color: "#b0581e"
    icon: create_new_age:generator_coil
    route_items: [create:mechanical_press, create_new_age:basic_solar_heating_plate, create_new_age:heater, create:brass_ingot, create_new_age:generator_coil, create_new_age:basic_energiser]
    summary: "Sheets and wires, solar heat instead of blaze burners, brass, and your first electricity."
    intro: |
      Blaze burners are out of reach, so heat comes from Create: New Age solar heating plates and heaters.
      Heated mixing makes brass; a Generator Coil spun next to magnetite makes electricity for the Energiser.
      The Mechanical Extruder turns lava and water into stone types, and the block you put under it changes
      what it makes (Appendix B).
  - group: "1.3: Improvements"
    title: Improvements
    color: "#2c8466"
    icon: quicreate:emerald_circuit
    route_items: [create_new_age:copper_circuit, quicreate:emerald_circuit, create_new_age:nuclear_fuel, ad_astra:steel_ingot, create_new_age:basic_motor]
    summary: "Circuits, motors, nuclear heat and steel."
    intro: |
      Circuits are the backbone of the rest of the pack. Superheated heat (from strong solar or a reactor)
      unlocks steel, which the rocket needs.
  - group: "1.4: Space"
    title: Space
    color: "#3d5f8f"
    icon: ad_astra:launch_pad
    route_items: [ad_astra:steel_plate, ad_astra:nasa_workbench, ad_astra:steel_engine, ad_astra:space_suit, ad_astra:fuel_bucket, ad_astra:launch_pad]
    summary: "Steel plates, a space suit, rocket fuel and your first rocket."
    intro: |
      Everything for the tier 1 rocket. The rocket itself is assembled in the NASA Workbench.
  - group: "Chapter 2: The Moon"
    title: The Moon
    color: "#5d6280"
    icon: ad_astra:moon_sand
    planet: moon
    route_items: [ad_astra:desh_ingot, minecraft:diamond, minecraft:ender_eye, cataclysm:void_core, quicreate:amethyst_circuit, ad_astra:desh_engine]
    summary: "Desh, diamonds and amethyst, the only stronghold, and the Ender Dragon (soft ending)."
    intro: |
      The only stronghold in the pack is on the Moon (the stronghold biome tag is set to the lunar wastelands).
      Kill the Ender Dragon to finish the soft ending, then build a tier 2 rocket for Mars.
  - group: "Chapter 3: Mars"
    title: Mars
    color: "#a23a28"
    icon: ad_astra:mars_sand
    planet: mars
    route_items: [ad_astra:ostrum_ingot, minecraft:netherite_ingot, cataclysm:ancient_metal_ingot, quicreate:ancient_metal_circuit, ad_astra:ostrum_engine]
    summary: "Ostrum, netherite, the Cursed Pyramid and the Ancient Remnant."
    intro: |
      Ostrum only comes from Mars (ore, and sifting Mars sand or conglomerate with the advanced brass mesh).
      Ancient debris is in the Mars rock: the worldgen places it at Y 90 to 130 and the conglomerate boulders can be
      sifted for it. Beat the Ancient Remnant in the Cursed Pyramid for ancient metal, which leads to the ancient
      metal circuit, the ostrum engine and the netherite space suit you need for the next two planets.
  - group: "Chapter 4: Venus & Mercury"
    title: Venus and Mercury
    color: "#b26a14"
    icon: ad_astra:venus_sand
    planets: [venus, mercury]
    route_items: [ad_astra:calorite_ingot, cards:platinum_ingot, cataclysm:witherite_ingot, cataclysm:ignitium_ingot, ad_astra:calorite_engine]
    summary: "Calorite, the Harbinger and Umvuthi on Venus; platinum, Ignis and the Netherite Monstrosity on Mercury."
    intro: |
      Both planets need heat protection: the quest book asks for the netherite space suit before you land
      (cursium armour also counts, see [[#netherite_space_suit]]). Venus has calorite, the Ancient Factory
      (Harbinger) and the new Fungal Forest, the only biome with Umvuthana Groves. Mercury is the only planet with platinum
      ore, the Burning Arena (Ignis) and the Soul Black Smith (Netherite Monstrosity).
  - group: "Chapter 5: Glacio"
    title: Glacio
    color: "#2a7f9e"
    icon: ad_astra:glacio_stone
    planet: glacio
    route_items: [cataclysm:black_steel_ingot, createutilities:void_steel_ingot, cataclysm:cursium_ingot, cataclysm:essence_of_the_storm, mowziesmobs:ice_crystal]
    summary: "The last world, four structures and the materials for the creative parts."
    intro: |
      Glacio holds the last bosses. Maledictus (Frosted Prison) gives cursium, Scylla (Acropolis) gives the
      essence of the storm, and the Frostmaw gives the ice crystal. All three feed the creative parts in the
      next chapter. The Sunken City (Leviathan) and the Ferrous Wroughtnaut are optional.
  - group: "Endgame: Creative"
    title: The Creative Ending
    color: "#7a3c9c"
    icon: quicreate:creative_alloy
    route_items: [quicreate:creative_alloy, quicreate:creative_sheet, create:creative_motor, create:creative_blaze_cake, quicreate:creative_casing]
    summary: "Creative alloy, sheet, casing, motor and blaze cake: the true ending."
    intro: |
      Everything comes together: boss ingots go into the creative alloy, sixteen loops of sequenced assembly make
      the creative sheet, and the Mechanical Fusion Anvil turns a speed controller and a blaze cake into their
      creative versions. The three Quicreate swords at the end of the chapter are optional.
  - group: "Side: Cards & Mobs"
    title: "Side chapter: Cards and Mobs"
    color: "#2a7a78"
    icon: cards:common_card_pack
    route_items: [cards:common_card_pack, cards:nether_card_pack, minecraft:sheep_spawn_egg, minecraft:nether_star, balancedflight:flight_anchor]
    summary: "Card packs from sifting, spawn eggs from cards, the Wither and the Flight Anchor. Any time after the sifter."
    intro: |
      Many sifting tables drop card packs at small chances (Appendix A). Packs give cards, and the pack's
      CraftTweaker scripts turn mob cards into spawn eggs (Appendix D). Smelting an uncommon pack gives a nether
      pack, the way to wither skeletons and the Wither.

planets:
  moon:   {name: The Moon, dimension: "ad_astra:moon", tier: 1}
  mars:   {name: Mars, dimension: "ad_astra:mars", tier: 2}
  venus:  {name: Venus, dimension: "ad_astra:venus", tier: 3}
  mercury: {name: Mercury, dimension: "ad_astra:mercury", tier: 3}
  glacio: {name: Glacio, dimension: "ad_astra:glacio", tier: 4}

steps:
  umvuthi:
    note: >
      The datapack places Umvuthana Groves only in the Venus **Fungal Forest** biome
      (`mowziesmobs/worldgen/structure/umvuthana_grove.json`), so look there rather than in the wastelands.
  blaze_burner:
    note: >
      This quest exists to catch a blaze burner made outside the intended route. Heat for mixing comes from
      New Age heaters and solar plates (the next steps).
  ender_dragon:
    note: The End is reached through the stronghold's portal on the Moon. This is the pack's soft ending.
  void_core:
    note: >
      The Ender Golem's loot table drops a void core every kill. Golems are placed by the citadel's own code,
      so their spawn does not show up in the structure files.

# Items that the game draws in code (no texture file). Point them at a real texture from the files.
