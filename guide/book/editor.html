<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quicreate Book Editor</title>
<style>
  :root { --bg:#1d2027; --panel:#262a33; --panel2:#2d323c; --line:#3a3f4b; --text:#e6e6e6; --dim:#9aa0ab; --accent:#e0b33c; --bad:#e0584c; --ok:#5fbf6a; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.4 system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:6px; align-items:center; padding:7px 10px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:14px; margin:0 10px 0 0; }
  button, select, input, textarea { background:#323743; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 8px; font:inherit; }
  textarea { width:100%; resize:vertical; font:12px/1.45 Consolas, monospace; }
  button:hover:not(:disabled) { border-color:var(--accent); cursor:pointer; }
  button.primary { background:var(--accent); color:#1d2027; border-color:var(--accent); font-weight:600; }
  button.on { background:#4a3d18; border-color:var(--accent); }
  button.danger:hover { border-color:var(--bad); color:var(--bad); }
  button.small { padding:1px 6px; font-size:12px; }
  button:disabled { opacity:.4; }
  #status { margin-left:auto; color:var(--dim); }
  main { flex:1; display:flex; min-height:0; }
  #wrap { flex:1; overflow:auto; background:#14161b; }
  canvas { display:block; }
  aside { width:420px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; border:0; border-radius:0; background:transparent; padding:8px; }
  .tabs button.active { background:var(--panel2); color:var(--accent); box-shadow: inset 0 -2px var(--accent); }
  #panel { flex:1; overflow:auto; padding:10px 12px; }
  h2 { font-size:13px; margin:12px 0 6px; color:var(--accent); }
  label.f { display:block; color:var(--dim); margin:8px 0 3px; }
  input[type=text], input[type=number] { width:100%; }
  .row { display:flex; gap:6px; align-items:center; }
  .row > * { flex:none; }
  .grow { flex:1 !important; }
  .card { border:1px solid var(--line); border-radius:5px; padding:7px; margin:7px 0; background:var(--panel2); }
  .card .hd { display:flex; gap:4px; align-items:center; margin-bottom:5px; }
  .card .hd b { flex:1; }
  .help { color:var(--dim); font-size:12px; }
  .warn { color:var(--bad); font-size:12px; }
  .preview { background:#efe3c4; color:#2a2418; border-radius:3px; padding:6px 8px; margin-top:5px; font:12px/1.35 Georgia, serif; width:248px; white-space:normal; }
  .preview .t { font-weight:bold; text-align:center; border-bottom:1px solid #b9a77a; margin-bottom:4px; }
  .preview a { color:#1f4e8c; text-decoration:none; }
  .preview ul, .preview ol { margin:2px 0 2px 16px; padding:0; }
  .preview p { margin:0 0 6px; }
  .issues li { margin:3px 0; cursor:pointer; }
  .issues li:hover { color:var(--accent); }
  kbd { background:#323743; border:1px solid var(--line); border-radius:3px; padding:0 4px; }
</style>
</head>
<body>
<header>
  <h1>Book Editor</h1>
  <button id="open" class="primary">Open Quicreate folder…</button>
  <select id="tab" disabled></select>
  <button id="newStep" disabled title="Then click an empty cell">+ New step</button>
  <button id="linkMode" disabled title="Click the parent, then the child">Link</button>
  <button id="del" class="danger" disabled>Delete step</button>
  <button id="undo" disabled title="Ctrl+Z">Undo</button>
  <button id="save" class="primary" disabled title="Ctrl+S">Save</button>
  <label class="row"><input type="checkbox" id="showAll" checked> hidden lines</label>
  <span id="status">Open your Quicreate repo folder to start (Chrome or Edge).</span>
</header>
<main>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <aside>
    <div class="tabs">
      <button data-p="step" class="active">Step</button>
      <button data-p="pages">Pages</button>
      <button data-p="task">Task</button>
      <button data-p="lines">Lines</button>
      <button data-p="problems">Problems</button>
      <button data-p="builds">Builds</button>
    </div>
    <div id="panel"></div>
  </aside>
</main>
<script>
// ------------------------------------------------------------------ constants and state
const CELL = 34, NODE = 26, PAGE_W = 122;
const NS = 'quicreate', BOOKID = 'quicreate:skyblock';
const BOOK = 'src/main/resources/data/quicreate/modonomicon/books/skyblock';
const MB = 'src/main/resources/data/quicreate/modonomicon/multiblocks';
const ADV = 'src/main/resources/data/quicreate/advancements';
const LANG = 'src/main/resources/assets/quicreate/lang/en_us.json';
const OVR = 'guide/book/layout_overrides.json';
const SHAPES = { '1,0': 'Main step (grey square)', '0,1': 'Milestone (gold star)', '1,2': 'Optional (grey round)',
                 '0,2': 'Reading (gold round)', '0,0': 'Link (gold square)', '1,1': 'Grey star' };
const ANCHOR = /\/(intro|back|welcome)$/;
let BP = {}, BPNS = new Set();
let root = null, lang = {}, ovr = {}, tabs = {}, entries = {}, advs = {}, mbs = {}, dirtyM = new Set(), mbSel = null, mbLayer = 0, mbBrush = 'A';
let dirtyE = new Set(), dirtyA = new Set(), dirtyL = new Set(), deletedE = new Set(), deletedA = new Set();
// moves: old id -> new id; refE/refL: files rewritten only because a step moved (not saved as hand edits)
let moves = {}, movedFiles = new Set(), refE = new Set(), refL = new Set();
let undoStack = [], tab = null, sel = null, drag = null, mode = null, linkFrom = null, panelTab = 'step';
let view = { ox: 0, oy: 0 };
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

// ------------------------------------------------------------------ files
async function dirOf(path, create = true) {
  let d = root;
  for (const part of path.split('/').filter(Boolean)) d = await d.getDirectoryHandle(part, { create });
  return d;
}
async function readText(path) {
  const parts = path.split('/'); const name = parts.pop();
  const d = await dirOf(parts.join('/'), false);
  return (await (await d.getFileHandle(name)).getFile()).text();
}
async function readJson(path, fallback) { try { return JSON.parse(await readText(path)); } catch (e) { if (fallback !== undefined) return fallback; throw e; } }
async function writeJson(path, data) {
  const parts = path.split('/'); const name = parts.pop();
  const d = await dirOf(parts.join('/'));
  const w = await (await d.getFileHandle(name, { create: true })).createWritable();
  await w.write(JSON.stringify(data, null, 2) + '\n'); await w.close();
}
async function removeFile(path) {
  const parts = path.split('/'); const name = parts.pop();
  try { await (await dirOf(parts.join('/'), false)).removeEntry(name); } catch (e) { /* already gone */ }
}
async function walkJson(path, prefix, out) {
  const d = await dirOf(path, false);
  for await (const [n, h] of d.entries()) {
    if (h.kind === 'directory') await walkJson(path + '/' + n, prefix + n + '/', out);
    else if (n.endsWith('.json')) out[prefix + n.slice(0, -5)] = { file: path + '/' + n, json: JSON.parse(await (await h.getFile()).text()) };
  }
}

// ------------------------------------------------------------------ loading
$('open').onclick = async () => {
  if (!window.showDirectoryPicker) { alert('This needs Chrome or Edge (folder access).'); return; }
  root = await window.showDirectoryPicker({ mode: 'readwrite' });
  try { await dirOf(BOOK + '/entries', false); } catch (e) { alert('Pick the Quicreate repo folder (the one with src/ and guide/).'); return; }
  lang = await readJson(LANG, {});
  ovr = await readJson(OVR, {});
  if (!['layout', 'entries', 'advancements', 'lang', 'deleted', 'moved', 'multiblocks'].some(k => k in ovr) && Object.keys(ovr).length) ovr = { layout: ovr };   // old layout-only file
  for (const k of ['layout', 'entries', 'advancements', 'lang']) ovr[k] = ovr[k] || {};
  ovr.deleted = ovr.deleted || []; ovr.moved = ovr.moved || {}; ovr.deleted_advancements = ovr.deleted_advancements || [];
  tabs = {}; entries = {}; advs = {};
  const raw = {}; await walkJson(BOOK + '/entries', '', raw);
  for (const [k, v] of Object.entries(raw)) {
    const cat = k.split('/')[0], id = `${NS}:${k}`;
    entries[id] = { id, cat, file: v.file, json: v.json };
    (tabs[cat] = tabs[cat] || []).push(id);
  }
  BP = await readJson('guide/book/block_props.json', {}); BPNS = new Set(Object.keys(BP).map(b => b.split(':')[0]));
  mbs = {}; try { const rawM = {}; await walkJson(MB, '', rawM); for (const [k, v] of Object.entries(rawM)) mbs[`${NS}:${k}`] = { id: `${NS}:${k}`, file: v.file, json: v.json }; } catch (e) { }
  const rawA = {}; await walkJson(ADV, '', rawA);
  for (const [k, v] of Object.entries(rawA)) advs[`${NS}:${k}`] = { id: `${NS}:${k}`, file: v.file, json: v.json };
  const order = ['field_guide','sky','sifting','new_age','electricity','improvements','space','moon','mars','venus_mercury','glacio','creative',
                 'side_paths','builders','explorer','bestiary','workshop','kitchen','cards'];
  const s = $('tab'); s.innerHTML = '';
  for (const c of Object.keys(tabs).sort((a, b) => ((order.indexOf(a) + 99) % 199) - ((order.indexOf(b) + 99) % 199)))
    s.add(new Option(`${catName(c)} (${tabs[c].length})`, c));
  for (const b of ['tab', 'newStep', 'linkMode', 'del', 'undo', 'save']) $(b).disabled = false;
  setTab(s.value);
  status(`Loaded ${Object.keys(entries).length} steps, ${Object.keys(advs).length} advancements.`);
};
function catName(c) { return lang[`book.quicreate.skyblock.cat.${c}`] || c; }
$('tab').onchange = e => setTab(e.target.value);
$('showAll').onchange = draw;
function status(t) { $('status').textContent = t; }
const T = k => (k && lang[k] !== undefined) ? lang[k] : (k || '');
function name(e) { return T(e.json.name) || e.id.split('/').pop(); }

// ------------------------------------------------------------------ undo / dirty
function snapshot() {
  undoStack.push(JSON.stringify({ m: mbs, dm: [...dirtyM], e: entries, a: advs, l: lang, t: tabs, de: [...deletedE], da: [...deletedA],
                                  dE: [...dirtyE], dA: [...dirtyA], dL: [...dirtyL], mv: moves, mf: [...movedFiles], rE: [...refE], rL: [...refL] }));
  if (undoStack.length > 60) undoStack.shift();
}
function undo() {
  const s = undoStack.pop(); if (!s) return;
  const o = JSON.parse(s); mbs = o.m || mbs; dirtyM = new Set(o.dm || []); entries = o.e; advs = o.a; lang = o.l; tabs = o.t;
  deletedE = new Set(o.de); deletedA = new Set(o.da); dirtyE = new Set(o.dE); dirtyA = new Set(o.dA); dirtyL = new Set(o.dL);
  moves = o.mv; movedFiles = new Set(o.mf); refE = new Set(o.rE); refL = new Set(o.rL);
  if (sel && !entries[sel]) sel = null;
  renderPanel(); draw();
}
$('undo').onclick = undo;
const touchE = id => { dirtyE.add(id); };
const touchA = id => { dirtyA.add(id); };
function setLang(k, v) { lang[k] = v; dirtyL.add(k); }

// ------------------------------------------------------------------ geometry (Modonomicon's line rules)
function setTab(c) {
  tab = c; sel = null; linkFrom = null;
  const xs = tabs[c].map(id => entries[id].json.x), ys = tabs[c].map(id => entries[id].json.y);
  const minx = Math.min(...xs) - 4, maxx = Math.max(...xs) + 4, miny = Math.min(...ys) - 4, maxy = Math.max(...ys) + 4;
  view.ox = -minx; view.oy = -miny;
  cv.width = (maxx - minx + 1) * CELL; cv.height = (maxy - miny + 1) * CELL;
  renderPanel(); draw();
}
const px = x => (x + view.ox) * CELL + CELL / 2, py = y => (y + view.oy) * CELL + CELL / 2;
function reverseBroken(p, c) { return c.x <= p.x - 2 && c.y >= p.y + 2; }
function pathCells(p, c, rev) {
  const out = []; const sx = c.x > p.x ? 1 : -1, sy = c.y > p.y ? 1 : -1;
  if (!rev) {
    if (c.x !== p.x) for (let x = p.x + sx; x !== c.x + sx; x += sx) out.push([x, p.y]);
    if (c.y !== p.y) for (let y = p.y + sy; y !== c.y; y += sy) out.push([c.x, y]);
  } else {
    if (c.y !== p.y) for (let y = p.y + sy; y !== c.y + sy; y += sy) out.push([p.x, y]);
    if (c.x !== p.x) for (let x = p.x + sx; x !== c.x; x += sx) out.push([x, c.y]);
  }
  return out.filter(([x, y]) => !(x === c.x && y === c.y));
}
function lines() {
  const out = [];
  for (const id of tabs[tab]) {
    for (const p of entries[id].json.parents || []) {
      const pe = entries[p.entry]; if (!pe || pe.cat !== tab) continue;
      if (p.line_enabled === false && ANCHOR.test(p.entry)) continue;
      out.push({ child: id, parent: p.entry, enabled: p.line_enabled !== false, rev: !!p.line_reversed });
    }
  }
  return out;
}
function analyse() {
  const occ = new Map(); for (const id of tabs[tab]) occ.set(entries[id].json.x + ',' + entries[id].json.y, id);
  const ls = lines(), use = new Map(), issues = [];
  for (const l of ls) {
    if (!l.enabled) continue;
    const a = entries[l.parent].json, b = entries[l.child].json;
    l.cells = pathCells(a, b, l.rev);
    const pts = [[a.x, a.y], ...l.cells, [b.x, b.y]]; l.segs = [];
    for (let i = 1; i < pts.length; i++) l.segs.push([pts[i - 1].join(','), pts[i].join(',')].sort().join('|'));
    for (const s of l.segs) use.set(s, (use.get(s) || 0) + 1);
  }
  for (const l of ls) {
    if (!l.enabled) continue;
    l.through = l.cells.filter(([x, y]) => occ.has(x + ',' + y)).map(([x, y]) => occ.get(x + ',' + y));
    l.shared = l.segs.some(s => use.get(s) > 1);
    l.broken = l.rev && reverseBroken(entries[l.parent].json, entries[l.child].json);
    const nm = `${name(entries[l.parent])} → ${name(entries[l.child])}`;
    if (l.broken) issues.push({ id: l.child, text: `${nm}: reversed bend draws wrong in game (untick reverse)` });
    if (l.through.length) issues.push({ id: l.child, text: `${nm} runs through ${l.through.map(t => name(entries[t])).join(', ')}` });
  }
  const seen = new Map();
  for (const id of tabs[tab]) {
    const k = entries[id].json.x + ',' + entries[id].json.y;
    if (seen.has(k)) issues.push({ id, text: `${name(entries[id])} sits on ${name(entries[seen.get(k)])}` });
    seen.set(k, id);
    for (const [i, pg] of (entries[id].json.pages || []).entries()) {
      for (const m of T(pg.text).matchAll(/entry:\/\/([a-z_]+:[a-z_]+)\/([a-z0-9_\/]+)/g))
        if (!entries[`${NS}:${m[2]}`]) issues.push({ id, text: `${name(entries[id])}: page ${i + 1} links to a step that doesn't exist (${m[2]})` });
      const n = pageLines(pg); const cap = pageCap(pg);
      if (n > cap) issues.push({ id, text: `${name(entries[id])}: page ${i + 1} is about ${n} lines, fits ${cap}` });
    }
  }
  const shared = ls.filter(l => l.enabled && l.shared).length;
  if (shared) issues.push({ id: null, text: `${shared} lines share a stretch with another line (orange)` });
  return { ls, issues };
}

// ------------------------------------------------------------------ drawing
function draw() {
  if (!tab) return;
  const { ls } = analyse();
  ctx.fillStyle = '#14161b'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = '#20232a'; ctx.lineWidth = 1;
  for (let x = 0; x < cv.width; x += CELL) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cv.height); ctx.stroke(); }
  for (let y = 0; y < cv.height; y += CELL) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cv.width, y); ctx.stroke(); }
  for (const l of ls) {
    if (!l.enabled && !$('showAll').checked) continue;
    const a = entries[l.parent].json, b = entries[l.child].json;
    const mid = l.rev ? [a.x, b.y] : [b.x, a.y];
    ctx.setLineDash(l.enabled ? [] : [3, 4]);
    ctx.strokeStyle = !l.enabled ? '#555b66' : (l.through.length || l.broken) ? '#e0584c' : l.shared ? '#e0953c' : '#c8ccd4';
    ctx.lineWidth = (sel && (l.child === sel || l.parent === sel)) ? 3 : 1.6;
    ctx.beginPath(); ctx.moveTo(px(a.x), py(a.y)); ctx.lineTo(px(mid[0]), py(mid[1])); ctx.lineTo(px(b.x), py(b.y)); ctx.stroke();
    if (l.enabled) {
      const corner = (mid[0] === b.x && mid[1] === b.y) ? [a.x, a.y] : mid;
      const ang = Math.atan2(py(b.y) - py(corner[1]), px(b.x) - px(corner[0]));
      const tx = px(b.x) - Math.cos(ang) * NODE / 2, ty = py(b.y) - Math.sin(ang) * NODE / 2;
      ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(tx, ty);
      ctx.lineTo(tx - 7 * Math.cos(ang - .45), ty - 7 * Math.sin(ang - .45));
      ctx.lineTo(tx - 7 * Math.cos(ang + .45), ty - 7 * Math.sin(ang + .45)); ctx.closePath(); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
    }
  }
  ctx.setLineDash([]);
  for (const id of tabs[tab]) {
    const e = entries[id].json, x = px(e.x), y = py(e.y);
    const u = e.background_u_index || 0, v = e.background_v_index || 0;
    ctx.fillStyle = u === 0 ? '#c99a2e' : '#8d929c';
    ctx.strokeStyle = id === sel ? '#ffffff' : id === linkFrom ? '#5fbf6a' : '#111';
    ctx.lineWidth = (id === sel || id === linkFrom) ? 3 : 1.5;
    ctx.beginPath();
    if (v === 2) ctx.arc(x, y, NODE / 2, 0, Math.PI * 2);
    else if (v === 1) { for (let i = 0; i < 10; i++) { const r = i % 2 ? NODE / 3 : NODE / 1.8, t = Math.PI / 5 * i - Math.PI / 2; ctx.lineTo(x + r * Math.cos(t), y + r * Math.sin(t)); } ctx.closePath(); }
    else ctx.rect(x - NODE / 2, y - NODE / 2, NODE, NODE);
    ctx.globalAlpha = e.hide_while_locked ? 0.45 : 1; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke();
    if (e.hide_while_locked) { ctx.setLineDash([3, 3]); ctx.strokeStyle = '#9ad'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, NODE * 0.75, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    const nm = name(entries[id]);
    ctx.fillStyle = '#111'; ctx.font = 'bold 9px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(nm.replace(/[^A-Za-z0-9]/g, '').slice(0, 3), x, y + 3);
    ctx.fillStyle = '#d7dae0'; ctx.font = '10px system-ui';
    ctx.fillText(nm.length > 16 ? nm.slice(0, 15) + '…' : nm, x, y + NODE / 2 + 11);
  }
  if (panelTab === 'problems') renderPanel();
}

// ------------------------------------------------------------------ mouse and keys
function cellAt(ev) { const r = cv.getBoundingClientRect(); return [Math.floor((ev.clientX - r.left) / CELL) - view.ox, Math.floor((ev.clientY - r.top) / CELL) - view.oy]; }
function hit(ev) { const [x, y] = cellAt(ev); return tabs[tab]?.find(id => entries[id].json.x === x && entries[id].json.y === y); }
cv.onmousedown = ev => {
  if (!tab) return;
  const id = hit(ev);
  if (mode === 'new') { if (!id) createStep(...cellAt(ev)); setMode(null); return; }
  if (mode === 'link') {
    if (!id) return;
    if (!linkFrom) { linkFrom = id; status('Now click the child step.'); draw(); return; }
    if (id !== linkFrom) addParent(id, linkFrom);
    linkFrom = null; status('Linked. Click another parent, or press Link again to stop.'); return;
  }
  sel = id || null; if (id) { snapshot(); drag = id; }
  renderPanel(); draw();
};
cv.onmousemove = ev => {
  if (!drag) { cv.style.cursor = mode ? 'crosshair' : hit(ev) ? 'grab' : 'default'; return; }
  const [x, y] = cellAt(ev), e = entries[drag].json;
  if ((e.x !== x || e.y !== y) && !tabs[tab].some(id => id !== drag && entries[id].json.x === x && entries[id].json.y === y)) {
    e.x = x; e.y = y; touchE(drag); draw();
  }
};
window.onmouseup = () => { if (drag) renderPanel(); drag = null; };
window.onkeydown = ev => {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
  if ((ev.ctrlKey || ev.metaKey) && ev.key === 's') { ev.preventDefault(); save(); return; }
  if (typing) return;
  if ((ev.ctrlKey || ev.metaKey) && ev.key === 'z') { ev.preventDefault(); undo(); }
  if (ev.key === 'Escape') { setMode(null); }
  if (sel && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(ev.key)) {
    ev.preventDefault(); const e = entries[sel].json;
    const [dx, dy] = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
    if (!tabs[tab].some(id => entries[id].json.x === e.x + dx && entries[id].json.y === e.y + dy)) { snapshot(); e.x += dx; e.y += dy; touchE(sel); renderPanel(); draw(); }
  }
};
function setMode(m) {
  mode = (mode === m) ? null : m; linkFrom = null;
  $('newStep').classList.toggle('on', mode === 'new'); $('linkMode').classList.toggle('on', mode === 'link');
  status(mode === 'new' ? 'Click an empty cell for the new step (Esc to cancel).' : mode === 'link' ? 'Click the parent step, then the child.' : '');
  draw();
}
$('newStep').onclick = () => setMode('new');
$('linkMode').onclick = () => setMode('link');
$('del').onclick = () => { if (sel) deleteStep(sel); };

// ------------------------------------------------------------------ step helpers
function ownAdv(id) {
  const e = entries[id]?.json; if (!e) return null;
  for (const p of e.pages || []) if (p.condition?.type === 'modonomicon:advancement') return p.condition.advancement_id;
  return null;
}
// the unlock condition is a list of advancements (an "and"); parents add theirs, other tabs' requirements stay
function condAdvs(e) {
  const c = e.condition; if (!c) return [];
  if (c.type === 'modonomicon:advancement') return [c];

  if (!n) { status('Nothing to save.'); return; }
  ovr.moved = ovr.moved || {};
  for (const [o, t] of Object.entries(moves)) {
    for (const [a, b] of Object.entries(ovr.moved)) if (b === o) ovr.moved[a] = t;   // chain earlier moves
    if (!Object.values(ovr.moved).includes(t)) ovr.moved[o] = t;
    for (const sec of ['entries', 'layout']) if (ovr[sec][o]) { if (sec === 'entries') ovr.entries[t] = ovr.entries[o]; delete ovr[sec][o]; }
  }
  for (const [a, b] of Object.entries(ovr.moved)) if (a === b) delete ovr.moved[a];
  for (const id of movedFiles) await removeFile(`${BOOK}/entries/${id.split(':')[1]}.json`);
  for (const id of refE) if (entries[id] && !dirtyE.has(id)) await writeJson(entries[id].file, entries[id].json);
  for (const id of dirtyE) {
    if (!entries[id]) continue;
    await writeJson(entries[id].file, entries[id].json);
    ovr.entries[id] = entries[id].json; delete ovr.layout[id];
  }
  for (const id of deletedE) {
    await removeFile(`${BOOK}/entries/${id.split(':')[1]}.json`);
    delete ovr.entries[id]; delete ovr.layout[id]; if (!ovr.deleted.includes(id)) ovr.deleted.push(id);
  }
  ovr.multiblocks = ovr.multiblocks || {};
  const badM = [...dirtyM].filter(id => mbs[id] && mbProblems(mbs[id].json).length);
  if (badM.length) alert(`Not saving these builds until their problems are fixed (Builds tab): ${badM.join(', ')}`);
  for (const id of dirtyM) { if (!mbs[id] || badM.includes(id)) continue; await writeJson(mbs[id].file, mbs[id].json); ovr.multiblocks[id] = mbs[id].json; }
  dirtyM = new Set(badM);
  for (const id of dirtyA) { if (!advs[id]) continue; await writeJson(advs[id].file, advs[id].json); ovr.advancements[id] = advs[id].json; }
  for (const id of deletedA) {
    await removeFile(`${ADV}/${id.split(':')[1]}.json`);
    delete ovr.advancements[id]; if (!ovr.deleted_advancements.includes(id)) ovr.deleted_advancements.push(id);
  }
  if (dirtyL.size) {
    const fileLang = await readJson(LANG, {});
    for (const k of dirtyL) { fileLang[k] = lang[k]; ovr.lang[k] = lang[k]; }
  }
  if (refL.size) {
    const fileLang = await readJson(LANG, {});
    for (const k of refL) { fileLang[k] = lang[k]; if (k in ovr.lang) ovr.lang[k] = lang[k]; }
    await writeJson(LANG, fileLang);
  }
  await writeJson(OVR, ovr);
  dirtyE.clear(); dirtyA.clear(); dirtyL.clear(); deletedE.clear(); deletedA.clear();
  moves = {}; movedFiles.clear(); refE.clear(); refL.clear();
  status(`Saved ${n} changes. Rebuild the mod (build-and-install.ps1) to see them in game.`);
}
$('save').onclick = save;
window.onbeforeunload = e => { if (dirtyM.size + dirtyE.size + dirtyA.size + dirtyL.size + deletedE.size + deletedA.size + refE.size + movedFiles.size) { e.preventDefault(); e.returnValue = ''; } };
renderPanel();
</script>
</body>
</html>
